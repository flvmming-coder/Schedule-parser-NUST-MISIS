<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ к расписанию НФ НИТУ МИСИС</title>
  <style>
    :root {
      --ink: #15232d;
      --muted: #63727f;
      --line: #d9e1e8;
      --paper: #ffffff;
      --bg: #f3f7f9;
      --teal: #0b6b6f;
      --coral: #f06f58;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      background: #0d2c36;
      color: white;
      padding: 22px 18px 18px;
      border-bottom: 4px solid var(--coral);
    }

    .wrap {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .title {
      margin: 0;
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 700;
      line-height: 1.08;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #c8d8de;
      font-size: 15px;
    }

    main {
      min-height: calc(100vh - 112px);
      display: grid;
      place-items: center;
      padding: 24px 14px;
    }

    .access-box {
      width: min(440px, 100%);
      display: grid;
      gap: 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 16px 34px rgba(19, 35, 45, 0.12);
    }

    .access-box h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .password-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      gap: 8px;
    }

    input,
    button {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      padding: 0 12px;
    }

    input {
      width: 100%;
    }

    button {
      border-color: var(--teal);
      background: var(--teal);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      padding: 0;
      background: #ffffff;
      color: var(--teal);
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .error {
      margin: 0;
      min-height: 20px;
      color: var(--coral);
      font-size: 14px;
    }

    body.open-access .protected-only {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 class="title">Расписание НФ НИТУ МИСИС</h1>
      <p class="subtitle">Сетевой просмотр расписания • версия {{VERSION}}</p>
    </div>
  </header>

  <main>
    <form id="accessForm" class="access-box">
      <h2 id="accessTitle">Доступ к расписанию</h2>
      <label class="protected-only">Пароль
        <span class="password-row">
          <input id="accessPassword" type="password" autocomplete="current-password">
          <button id="togglePassword" class="icon-button" type="button" title="Показать пароль" aria-label="Показать пароль">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </span>
      </label>
      <button id="accessButton" type="submit">Войти</button>
      <p id="accessError" class="error" hidden></p>
    </form>
  </main>

  <script>
    const accessProtected = "{{ACCESS_PROTECTED}}" === "true";
    const passwordKey = "nust-misis-schedule-password";
    const els = {
      form: document.getElementById("accessForm"),
      title: document.getElementById("accessTitle"),
      password: document.getElementById("accessPassword"),
      toggle: document.getElementById("togglePassword"),
      button: document.getElementById("accessButton"),
      error: document.getElementById("accessError")
    };

    if (!accessProtected) {
      document.body.classList.add("open-access");
      els.title.textContent = "Расписание доступно";
      els.button.textContent = "Открыть расписание";
      sessionStorage.removeItem(passwordKey);
    }

    if (new URLSearchParams(location.search).has("denied")) {
      sessionStorage.removeItem(passwordKey);
      showError("Доступ не открыт.");
    }

    els.toggle.addEventListener("click", () => {
      const visible = els.password.type === "text";
      els.password.type = visible ? "password" : "text";
      els.toggle.title = visible ? "Показать пароль" : "Скрыть пароль";
      els.toggle.setAttribute("aria-label", els.toggle.title);
    });

    els.form.addEventListener("submit", event => {
      event.preventDefault();
      els.error.hidden = true;

      if (accessProtected) {
        const password = els.password.value || "";
        if (!password) {
          showError("Доступ не открыт.");
          return;
        }

        sessionStorage.setItem(passwordKey, password);
      }

      location.href = "schedule.html";
    });

    function showError(text) {
      els.error.textContent = text;
      els.error.hidden = false;
    }
  </script>
</body>
</html>
